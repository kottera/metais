metais: "1.0"
name: example
version: 1.0.0
title: Example
description: An example package.
guide: Supply a report.
inputs:
  - name: report
    title: Report
    schema: inputs/report.schema.json
outputs:
  - id: report
    template: report.md.liquid
    path: "{{ inputs.report.title | downcase | replace: ' ', '-' | append: '.md' }}"
    when: "inputs.report.title != blank"
  - id: each
    template: report.md.liquid
    path: "item-{{ item.title | url_encode }}.md"
    for_each: "inputs.report.items | where: 'draft', false | sort: 'title'"
