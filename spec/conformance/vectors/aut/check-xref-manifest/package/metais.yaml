metais: "1.0"
name: example
version: 1.0.0
title: Example
description: An example package.
guide: Supply a report.
inputs:
  - name: report
    title: Report
    schema: inputs/report.schema.json
  - name: spare
    title: Spare
    schema: inputs/report.schema.json
outputs:
  - id: report
    template: report.md.liquid
    when: inputs.report.titel
  - id: pages
    template: page.md.liquid
    for_each: inputs.report.title
    path: "pages/{{ item }}.md"
