metais: "1.0"
name: org.example.inputs
version: 1.0.0
title: Inputs
description: A package whose inputs are validated.
guide: Supply the inputs.
inputs:
  - name: comma
    title: Comma
    schema: inputs/comma.schema.json
    forms: [csv]
  - name: semi
    title: Semi
    schema: inputs/semi.schema.json
    forms: [csv]
    csv: {delimiter: ";"}
  - name: pipe
    title: Pipe
    schema: inputs/pipe.schema.json
    forms: [csv]
    csv: {delimiter: "|"}
  - name: tab
    title: Tab
    schema: inputs/tab.schema.json
    forms: [csv]
    csv: {delimiter: "\t"}
outputs:
  - id: report
    template: report.md.liquid
