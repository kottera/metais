metais: "1.0"
name: example
version: 1.0.0
title: Example
description: An example package.
guide: Supply the inputs and render.
inputs: []
outputs:
  - id: logo
    asset: logo.svg
  - id: page
    template: page.txt.liquid
    path: "{% asset 'logo.svg' %}.txt"
  - id: both
    template: page.txt.liquid
    path: "{{ package.name }}-{% asset 'logo.svg', as: 'contents' %}-{% render 'page.txt.liquid' %}.txt"
