#
# Publishes metais.org with GitHub Pages from a published release's tag
# (ADR-013 D7 item 3.4): the pages of site/package and site/public, and
# every schema of spec/schemas/ and docs/cli/schemas/ at the path its $id
# names, built by site/build.sh --release from the tagged commit with the
# release's version and SHA256SUMS.
#
# release.yml calls it as its last job, once the release is published. A
# release published with that workflow's own token starts no workflow, so
# this workflow has no release trigger. Dispatched by hand, with a
# published release's tag, it rebuilds and redeploys that release's site,
# as an erratum does (ADR-011 Amendment A8 item 1). Either way the build
# job refuses a tag that is not v<version> or whose release is not
# published, so the site never describes a release that is not out, and it
# never builds from a branch.
#
# GitHub's free plan publishes Pages only from a public repository, so
# every job is gated on the repository being public: on a private
# repository each job is skipped, nothing runs and nothing fails.
# docs/dev/release.md has the go-live steps.
name: pages

on:
  workflow_call:
    inputs:
      tag:
        description: The published release whose site to build, by its tag, v<version>
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The published release whose site to build, by its tag, v<version>
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: the tag's release is published
        run: |
          case $TAG in
          v[0-9]*) ;;
          *) echo "pages: $TAG is not a release's tag, v<version>" >&2; exit 1 ;;
          esac
          draft=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .draft) || {
            echo "pages: there is no published release $TAG" >&2
            exit 1
          }
          if [ "$draft" != false ]; then
            echo "pages: the release $TAG is not published" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: gh release download "$TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP/release"
      - run: site/build.sh --release "${TAG#v}" "$RUNNER_TEMP/release/SHA256SUMS" _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
