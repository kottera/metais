#
# CI, the gate of an outside pull request (ADR-013 D5, ADR-010 Amendment
# A8 item 4): the third tier beside the scoped tier and the wave tier
# (AGENTS.md, Development). It runs on GitHub-hosted runners only, and
# internal/guarantees' TestWorkflows holds every workflow to that.
#
# It runs on every pull request and on every push to main (ADR-013 D5
# items 2 and 5), and when dispatched by hand. A first-time contributor's
# pull request waits for a maintainer to approve its run. The pull_request
# trigger includes the edited type, so an edit to a pull request's title or
# body runs the dco job's co-author check again; every job runs again with
# it, so no job's check on the head commit is replaced by a skipped one. A
# newer run of the same pull request cancels the one in progress.
#
# A dispatch's jobs input runs one job, or install's two, so a red is
# proved fixed without paying for the others: debug a red that is not
# platform-specific on Linux, and prove the macOS jobs once. A run that is
# not dispatched has no input, and runs every job.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      jobs:
        description: The job to run, or all of them
        type: choice
        options: [all, wave, macos, dco, shell, site, install, install-linux, install-macos]
        default: all
      base:
        description: The DCO check's base; it checks the commits not on it, or the dispatched commit alone when that is on it
        type: string
        default: origin/main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The wave tier's list (ADR-010 Amendment A5) on linux/amd64: gate.sh
  # wave, which runs AGENTS.md's list, at the runner's whole share, since a
  # hosted runner runs nothing else.
  #
  # internal/conformance's one test binary cannot finish within go test's
  # timeout on a 2-core runner, so the job splits it by -run, as R-W6-3
  # split the SC7 reach (R-W1-4, plan orchestrator, 2026-10-22):
  # conformance.sh skip names its tests, gate.sh runs everything else with
  # them skipped, and conformance.sh run runs each in its own invocation,
  # TestConformance once per area. Both lists are read when the job runs.
  wave:
    if: ${{ inputs.jobs == '' || inputs.jobs == 'all' || inputs.jobs == 'wave' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod download
      - name: gate.sh wave, internal/conformance's split tests aside
        run: |
          skip=$(.github/scripts/conformance.sh skip)
          rc=0
          GOFLAGS="-skip=$skip" METAIS_GATE_P=$(nproc) .claude/skills/verification-gate/gate.sh wave || rc=$?
          cat .local/gate/latest.log
          exit $rc
      - name: internal/conformance, split
        if: ${{ !cancelled() }}
        run: .github/scripts/conformance.sh run

  # The race-enabled tests and the build steps on darwin/arm64, with
  # internal/conformance split as in the wave job (R-W1-4).
  macos:
    if: ${{ inputs.jobs == '' || inputs.jobs == 'all' || inputs.jobs == 'macos' }}
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go build ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -trimpath ./cmd/metais
      - name: go test -race -count=1 ./..., internal/conformance's split tests aside
        run: |
          skip=$(.github/scripts/conformance.sh skip)
          go test -race -count=1 ./... -skip "$skip"
      - name: internal/conformance, split
        if: ${{ !cancelled() }}
        run: .github/scripts/conformance.sh run

  # The DCO check (ADR-013 D3 item 2): every commit of the change carries
  # Signed-off-by:, with no exemption list. Beside it, the co-author check
  # (AGENTS.md, Git and pull requests): no commit of the change, and not a
  # pull request's title and body, the squash merge's message, carries a
  # Co-authored-by line. The squash body typed at the merge is not seen
  # here, which is why AGENTS.md has every merge pass it explicitly. The
  # pull_request trigger includes the edited type, so an edit to the title
  # or body runs the check again.
  dco:
    if: ${{ inputs.jobs == '' || inputs.jobs == 'all' || inputs.jobs == 'dco' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base || github.event.before }}
        run: .github/scripts/dco.sh "$BASE" HEAD
      - name: no Co-authored-by line
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base || github.event.before }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -n "$PR" ]; then
            printf '%s\n\n%s\n' "$TITLE" "$BODY" >"$RUNNER_TEMP/squash.txt"
            .github/scripts/coauthor.sh "$BASE" HEAD "$RUNNER_TEMP/squash.txt"
          else
            .github/scripts/coauthor.sh "$BASE" HEAD
          fi

  # shellcheck over the repository's shell scripts, site/public/install.sh
  # among them (ADR-013 D6 item 8). Fixtures are data, not scripts the
  # repository runs: a conformance vector's or an example's expected output,
  # and testdata. The install script's refusals are tested by the site's
  # tests, and its real installs by the install jobs.
  shell:
    if: ${{ inputs.jobs == '' || inputs.jobs == 'all' || inputs.jobs == 'shell' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          shellcheck --version
          git ls-files -z -- '*.sh' ':(exclude,glob)**/testdata/**' ':(exclude)spec/conformance/vectors' ':(exclude,glob)examples/**/expected/**' |
            xargs -0 shellcheck

  # The site's build and its tests (ADR-013 D8).
  site:
    if: ${{ inputs.jobs == '' || inputs.jobs == 'all' || inputs.jobs == 'site' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: site/build.sh "$RUNNER_TEMP/site"
      - run: go test -race -count=1 ./site/... ./internal/tools/site/...

  # A real install with site/public/install.sh on each platform it serves
  # (ADR-013 D6 item 8): install-test.sh builds a prerelease of the
  # dispatched commit with internal/tools/release, serves its archives and
  # SHA256SUMS on 127.0.0.1 at the paths github.com serves them from, and
  # installs it with the script as published, pinned both ways and into the
  # default directory, and requires the refusal of a repository with no
  # stable release. The builder clones this clone, so it is a whole one
  # rather than a shallow one.
  install-linux:
    if: ${{ inputs.jobs == '' || inputs.jobs == 'all' || inputs.jobs == 'install' || inputs.jobs == 'install-linux' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: .github/scripts/install-test.sh "$RUNNER_TEMP/install"

  install-macos:
    if: ${{ inputs.jobs == '' || inputs.jobs == 'all' || inputs.jobs == 'install' || inputs.jobs == 'install-macos' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: .github/scripts/install-test.sh "$RUNNER_TEMP/install"
